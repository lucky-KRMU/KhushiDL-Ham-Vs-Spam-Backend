services:
  - type: web
    name: ham-vs-spam-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KERAS_HOME
        value: /tmp/keras
      - key: KERAS_BACKEND
        value: tensorflow
      - key: ALLOWED_ORIGINS
        value: "*"
